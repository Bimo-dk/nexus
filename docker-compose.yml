name: nexus

# ============================================================================
# Bimo-Nexus full-stack orchestrator
#
# Each service has its own repo:
#   ../nexus-registry, ../nexus-host-template, ../nexus-gateway,
#   ../nexus-portal, ../nexus-example, ../nexus-proxy, ../nexus-remote-templat
# ============================================================================

services:
  # ===== INTERNAL SERVICES (no public port mapping) =====
  registry:
    build:
      context: ../nexus-registry
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN}
    image: nexus-registry:latest
    container_name: nexus-registry
    expose:
      - "8670"
    environment:
      NODE_ENV: production
      PORT: 8670
      NEXUS_TOKEN: ${NEXUS_TOKEN:-change-this-to-a-strong-secret-in-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    volumes:
      - registry-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8670/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nexus-net
    restart: unless-stopped

  remote-one:
    build:
      context: ../nexus-example/remote-one
    image: nexus-remote-one:latest
    container_name: nexus-remote-one
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nexus-net
    restart: unless-stopped

  remote-two:
    build:
      context: ../nexus-example/remote-two
    image: nexus-remote-two:latest
    container_name: nexus-remote-two
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nexus-net
    restart: unless-stopped

  host:
    build:
      context: ../nexus-host-template
      args:
        NEXUS_TOKEN: ${NEXUS_TOKEN:-change-this-to-a-strong-secret-in-production}
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN}
    image: nexus-host:latest
    container_name: nexus-host
    expose:
      - "80"
    depends_on:
      registry:
        condition: service_healthy
    networks:
      - nexus-net
    restart: unless-stopped

  # ===== PUBLIC SERVICES =====
  gateway:
    build:
      context: ../nexus-gateway
      args:
        NEXUS_TOKEN: ${NEXUS_TOKEN:-change-this-to-a-strong-secret-in-production}
    image: nexus-gateway:latest
    container_name: nexus-gateway
    environment:
      # Runtime config — substituted into /assets/config.json at container start
      HOST_REMOTE_ENTRY: ${HOST_REMOTE_ENTRY:-/host/remoteEntry.json}
      HOST_EXPOSED_MODULE: ${HOST_EXPOSED_MODULE:-./AppShell}
    ports:
      - "8668:80"
    depends_on:
      registry:
        condition: service_healthy
      host:
        condition: service_started
      remote-one:
        condition: service_started
      remote-two:
        condition: service_started
    networks:
      - nexus-net
    restart: unless-stopped

  portal:
    build:
      context: ../nexus-portal
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN}
    image: nexus-portal:latest
    container_name: nexus-portal
    ports:
      - "8669:80"
    environment:
      NODE_ENV: production
      NEXUS_TOKEN: ${NEXUS_TOKEN:-change-this-to-a-strong-secret-in-production}
      REGISTRY_URL: http://registry:8670
      GATEWAY_URL: http://gateway:80
      SESSION_SECRET: ${PORTAL_SESSION_SECRET:?PORTAL_SESSION_SECRET must be set in .env or environment}
      NEXUS_INITIAL_PASSWORD: ${PORTAL_INITIAL_PASSWORD:-}
    volumes:
      - portal-data:/data
    depends_on:
      registry:
        condition: service_healthy
    networks:
      - nexus-net
    restart: unless-stopped

volumes:
  registry-data:
    driver: local
  portal-data:
    driver: local

networks:
  nexus-net:
    driver: bridge
