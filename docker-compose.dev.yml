name: nexus-dev

services:
  registry:
    build: ./registry
    container_name: nexus-registry-dev
    ports:
      - "8670:8670"
    environment:
      NODE_ENV: development
      PORT: 8670
      NEXUS_TOKEN: dev-token-change-in-production
      ALLOWED_ORIGINS: http://localhost:8666,http://localhost:8667,http://localhost:8668,http://localhost:8669,http://localhost:8671
    volumes:
      - ./registry/src/data:/app/data
    networks:
      - nexus-net-dev

networks:
  nexus-net-dev:
    driver: bridge
